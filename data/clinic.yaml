# Bookable treatments. short = button label (Messenger cuts buttons at 20 characters).
# price: one session; packages: sessions bought together; options: variants with their own price.
services:
  - id: consult
    category: consult
    minutes: 30
    name: {mn: "Арьсны эмчийн үзлэг, зөвлөгөө", en: "Dermatologist consultation", ko: "피부과 전문의 상담"}
    short: {mn: "Эмчийн зөвлөгөө", en: "Consultation", ko: "전문의 상담"}
    price: {MNT: 30000, KRW: 0}
    price_note:
      mn: "Монголд 30,000₮ (тэр өдөртөө эмчилгээ хийлгэвэл эмчилгээний үнээс хасагдана). Солонгост үнэгүй."
      en: "30,000₮ in Mongolia (deducted from the treatment if you have one the same day). Free in Korea."
      ko: "몽골 30,000₮(당일 시술 시 시술비에서 차감). 한국 지점은 무료."
    details:
      mn: "Арьсны эмч арьсыг аппаратаар шинжилж, таны арьсанд тохирох эмчилгээ, хэдэн удаа хийх, нийт зардлыг тооцож өгнө."
      en: "A dermatologist analyses your skin with a skin scanner and plans the right treatment, the number of sessions and the total cost."
      ko: "피부과 전문의가 피부 진단기로 피부를 분석하고 맞춤 시술, 횟수, 총 비용을 안내해 드립니다."

  - id: acne_package
    category: acne
    minutes: 60
    name: {mn: "Батгын суурь багц эмчилгээ", en: "Acne care package", ko: "여드름 기본 관리 패키지"}
    short: {mn: "Батгын багц", en: "Acne package", ko: "여드름 패키지"}
    price: {MNT: 120000, KRW: 70000}
    packages:
      - {sessions: 5, MNT: 540000, KRW: 315000}
    details:
      mn: "Манай үндсэн батгын багц: арьс цэвэрлэгээ, батга түрхэц, салицилын хүчлийн хальслалт, LED гэрэл эмчилгээ. Үрэвсэл ихтэй батгад NeoBeam, Gold PTT эсвэл Select Acne лазертай хослуулна."
      en: "Our core acne package: deep cleansing, extraction, salicylic acid peel and LED light therapy. For heavily inflamed acne it is combined with NeoBeam, Gold PTT or Select Acne laser."
      ko: "기본 여드름 패키지: 딥클렌징, 압출, 살리실산 필링, LED 광치료. 염증성 여드름이 심하면 네오빔, 골드 PTT, 셀렉트 아크네 레이저와 병행합니다."

  - id: neobeam
    category: acne
    minutes: 30
    name: {mn: "NeoBeam лазер", en: "NeoBeam laser", ko: "네오빔 레이저"}
    short: {mn: "NeoBeam лазер", en: "NeoBeam laser", ko: "네오빔"}
    price: {MNT: 180000, KRW: 99000}
    packages:
      - {sessions: 5, MNT: 810000, KRW: 450000}
    details:
      mn: "Гүн дулааны лазераар тосны булчирхайг агшааж, үрэвсэлтэй батгыг багасган дахин сэдрэхээс сэргийлнэ."
      en: "A deep thermal laser that shrinks the oil glands, calms inflamed acne and helps stop it from flaring up again."
      ko: "깊은 열 에너지로 피지선을 축소시켜 염증성 여드름을 줄이고 재발을 예방합니다."

  - id: gold_ptt
    category: acne
    minutes: 60
    name: {mn: "Gold PTT (алтны нанобөөмт эмчилгээ)", en: "Gold PTT (Gold Photothermal Therapy)", ko: "골드 PTT (금 나노 광열치료)"}
    short: {mn: "Gold PTT", en: "Gold PTT", ko: "골드 PTT"}
    price: {MNT: 250000, KRW: 150000}
    packages:
      - {sessions: 3, MNT: 680000, KRW: 400000}
    details:
      mn: "Алтны нанобөөм ашиглан батганы нянг дулаанаар устгаж, үрэвсэл болон идээт батгыг намдаана."
      en: "Gold nanoparticles carry laser heat into the pores to destroy acne bacteria and calm inflamed and pus-filled acne."
      ko: "금 나노입자를 이용해 열로 여드름균을 제거하고 염증성·화농성 여드름을 진정시킵니다."

  - id: select_acne
    category: acne
    minutes: 60
    name: {mn: "Select Acne лазер (4 үе шаттай)", en: "Select Acne Laser (4-step acne treatment)", ko: "셀렉트 아크네 레이저 (4단계 여드름 치료)"}
    short: {mn: "Select Acne", en: "Select Acne", ko: "셀렉트 아크네"}
    price: {MNT: 220000, KRW: 130000}
    packages:
      - {sessions: 5, MNT: 990000, KRW: 590000}
    details:
      mn: "Батгыг 4 үе шаттайгаар эмчилж, нян устгах, үрэвсэл дарах, тослог хянах, арьс сэргээхийг зэрэг хийдэг."
      en: "Treats acne in 4 steps at once: kills bacteria, calms inflammation, controls oil and regenerates the skin."
      ko: "4단계로 여드름을 치료해 살균, 염증 완화, 피지 조절, 피부 재생을 동시에 진행합니다."

  - id: acne_scar
    category: acne
    minutes: 45
    name: {mn: "Батгын сорвины эмчилгээ (фракшнл CO2)", en: "Acne scar treatment (fractional CO2)", ko: "여드름 흉터 치료 (프락셀 CO2)"}
    short: {mn: "Батгын сорви", en: "Acne scars", ko: "여드름 흉터"}
    price: {MNT: 280000, KRW: 170000}
    packages:
      - {sessions: 3, MNT: 760000, KRW: 460000}
    details:
      mn: "Батга эдгэрсний дараах хонхор сорви, том нүхжилтийг фракшнл CO2 лазераар арьсыг шинэчилж жигдрүүлнэ. Идэвхтэй үрэвсэлтэй батга намдсаны дараа эхэлнэ. Улайлт 3–5 хоног байж болно."
      en: "Fractional CO2 laser resurfaces pitted acne scars and enlarged pores. Started once active inflammation has calmed down. Redness can last 3–5 days."
      ko: "프락셀 CO2 레이저로 패인 여드름 흉터와 넓은 모공을 재생시킵니다. 염증성 여드름이 가라앉은 후 시작하며, 붉은기가 3–5일 정도 있을 수 있습니다."

  - id: excel_v
    category: redness
    minutes: 30
    name: {mn: "Excel-V лазер (хацрын улайлт)", en: "Excel-V laser (cheek redness)", ko: "엑셀V 레이저 (볼 홍조)"}
    short: {mn: "Excel-V лазер", en: "Excel-V laser", ko: "엑셀V"}
    price: {MNT: 200000, KRW: 120000}
    packages:
      - {sessions: 5, MNT: 900000, KRW: 540000}
    details:
      mn: "Хацрын улайлт, судасны тор, батгын дараах улаан толбыг багасгах зорилгоор Excel-V лазер эмчилгээ хийнэ. Арьсны байдлаас хамааран Rejuran зэрэг skin booster-той хавсруулахад арьсны тайвшрал, нөхөн сэргэлт илүү сайн явагдана."
      en: "Excel-V laser reduces cheek redness, visible capillaries and red post-acne marks. Depending on your skin, combining it with a skin booster such as Rejuran gives better calming and recovery."
      ko: "엑셀V 레이저로 볼 홍조, 모세혈관 확장, 여드름 후 붉은 자국을 줄입니다. 피부 상태에 따라 리쥬란 등 스킨부스터와 병행하면 진정과 재생이 더 잘 됩니다."

  - id: rejuran
    category: booster
    minutes: 45
    name: {mn: "Rejuran болон skin booster", en: "Rejuran & skin boosters", ko: "리쥬란·스킨부스터"}
    short: {mn: "Rejuran, booster", en: "Rejuran, booster", ko: "리쥬란·부스터"}
    price: {MNT: 650000, KRW: 330000}
    price_note:
      mn: "Үнэ нь Rejuran Healer 2cc-ийнх. Лазер эмчилгээтэй нэг өдөр хийлгэвэл booster 10% хямд."
      en: "Price is for Rejuran Healer 2cc. 10% off the booster when done the same day as a laser treatment."
      ko: "리쥬란 힐러 2cc 기준 가격. 레이저 시술과 같은 날 받으면 부스터 10% 할인."
    options:
      - {name: {mn: "Rejuran Healer 2cc", en: "Rejuran Healer 2cc", ko: "리쥬란 힐러 2cc"}, MNT: 650000, KRW: 330000}
      - {name: {mn: "Juvelook 2cc", en: "Juvelook 2cc", ko: "쥬베룩 2cc"}, MNT: 550000, KRW: 290000}
      - {name: {mn: "Скин ботокс (бүтэн нүүр)", en: "Skin Botox (full face)", ko: "스킨보톡스 (전체)"}, MNT: 300000, KRW: 150000}
    details:
      mn: "Арьсны дотроос нөхөн сэргээж, чийгшүүлж, нарийн үрчлээ, нүхжилт, сул арьсыг сайжруулна. Батга, улайлтын лазертай хавсруулахад арьс илүү хурдан тайвширч сэргэнэ."
      en: "Regenerates and hydrates the skin from within, improving fine lines, pores and thin, tired skin. Combined with acne or redness lasers the skin calms and recovers faster."
      ko: "피부 속부터 재생·보습해 잔주름, 모공, 얇고 지친 피부를 개선합니다. 여드름·홍조 레이저와 병행하면 진정과 회복이 빨라집니다."

  - id: pico_toning
    category: pigment
    minutes: 30
    name: {mn: "Пико тонинг (сэвх, толбо)", en: "Pico toning (melasma, spots)", ko: "피코토닝 (기미·잡티)"}
    short: {mn: "Пико тонинг", en: "Pico toning", ko: "피코토닝"}
    price: {MNT: 150000, KRW: 79000}
    packages:
      - {sessions: 10, MNT: 1250000, KRW: 690000}
    details:
      mn: "Пикосекундын лазераар сэвх, нарны толбо, батгын дараах бор толбыг арьс гэмтээхгүйгээр бага багаар цайруулна. Ихэвчлэн 2 долоо хоног тутам 5–10 удаа."
      en: "Picosecond laser gently fades melasma, sun spots and brown post-acne marks without damaging the skin. Usually 5–10 sessions, every 2 weeks."
      ko: "피코초 레이저로 기미, 잡티, 여드름 후 갈색 자국을 피부 손상 없이 서서히 옅게 합니다. 보통 2주 간격 5–10회."

  - id: lifting
    category: lifting
    minutes: 60
    name: {mn: "Арьс чангалах (Ulthera, Thermage, Shurink)", en: "Lifting (Ulthera, Thermage, Shurink)", ko: "리프팅 (울쎄라·써마지·슈링크)"}
    short: {mn: "Арьс чангалах", en: "Lifting", ko: "리프팅"}
    price: {MNT: 450000, KRW: 250000}
    price_note:
      mn: "Shurink 300 мөрөөс эхэлнэ; доорх төрлүүдийг харна уу."
      en: "From Shurink 300 lines; see the options below."
      ko: "슈링크 300라인부터; 아래 옵션 참고."
    options:
      - {name: {mn: "Shurink 300 мөр", en: "Shurink 300 lines", ko: "슈링크 300라인"}, MNT: 450000, KRW: 250000}
      - {name: {mn: "Ulthera 300 цохилт", en: "Ulthera 300 shots", ko: "울쎄라 300샷"}, MNT: 1900000, KRW: 990000}
      - {name: {mn: "Thermage FLX 600 цохилт", en: "Thermage FLX 600 shots", ko: "써마지 FLX 600샷"}, MNT: 2900000, KRW: 1590000}
    details:
      mn: "Хэт авиа (Ulthera, Shurink) эсвэл радио давтамжаар (Thermage) арьсны гүн давхаргыг чангалж, нүүрний шугамыг тодруулна. Үр дүн 2–3 сарын дотор бүрэн гарна."
      en: "Ultrasound (Ulthera, Shurink) or radiofrequency (Thermage) tightens the deep skin layers and defines the jawline. Full results show within 2–3 months."
      ko: "초음파(울쎄라·슈링크) 또는 고주파(써마지)로 피부 깊은 층을 탄력 있게 당겨 턱선을 정리합니다. 2–3개월에 걸쳐 효과가 나타납니다."

  - id: botox_filler
    category: injectables
    minutes: 30
    name: {mn: "Ботокс, филлер", en: "Botox & filler", ko: "보톡스·필러"}
    short: {mn: "Ботокс, филлер", en: "Botox & filler", ko: "보톡스·필러"}
    price: {MNT: 250000, KRW: 99000}
    price_note:
      mn: "Духны ботоксоос эхэлнэ; доорх төрлүүдийг харна уу."
      en: "From forehead Botox; see the options below."
      ko: "이마 보톡스부터; 아래 옵션 참고."
    options:
      - {name: {mn: "Духны/хөмсөгний завсрын ботокс", en: "Forehead or frown-line Botox", ko: "이마·미간 보톡스"}, MNT: 250000, KRW: 99000}
      - {name: {mn: "Эрүүний ботокс", en: "Jaw Botox", ko: "사각턱 보톡스"}, MNT: 300000, KRW: 120000}
      - {name: {mn: "Филлер 1cc", en: "Filler 1cc", ko: "필러 1cc"}, MNT: 550000, KRW: 290000}
    details:
      mn: "Үрчлээ, эрүүний булчин, уруул, хамар, нүдний доорх хонхорыг засна. Эмч үзсэний дараа хэмжээг тохируулна."
      en: "Softens wrinkles, slims the jaw muscle and shapes lips, nose and under-eye hollows. The doctor sets the amount after examining you."
      ko: "주름, 사각턱, 입술, 코, 눈밑 꺼짐을 개선합니다. 진료 후 용량을 정합니다."

  - id: aqua_peel
    category: care
    minutes: 45
    name: {mn: "Аква пийл, LDM чийгшүүлэх арчилгаа", en: "Aqua peel & LDM hydration care", ko: "아쿠아필·LDM 수분관리"}
    short: {mn: "Аква пийл, LDM", en: "Aqua peel, LDM", ko: "아쿠아필·LDM"}
    price: {MNT: 90000, KRW: 50000}
    options:
      - {name: {mn: "Аква пийл", en: "Aqua peel", ko: "아쿠아필"}, MNT: 90000, KRW: 50000}
      - {name: {mn: "LDM чийгшүүлэх", en: "LDM hydration", ko: "LDM 물방울 리프팅"}, MNT: 80000, KRW: 50000}
      - {name: {mn: "Аква пийл + LDM", en: "Aqua peel + LDM", ko: "아쿠아필 + LDM"}, MNT: 150000, KRW: 90000}
    details:
      mn: "Нүхжилтийн бохирдол, хар толгойг цэвэрлэж, арьсыг гүн чийгшүүлнэ. Лазерын дараах арчилгаанд ч тохиромжтой."
      en: "Deep-cleans pores and blackheads and hydrates the skin. Also good as care after laser treatments."
      ko: "모공 속 노폐물과 블랙헤드를 제거하고 깊이 수분을 공급합니다. 레이저 후 관리로도 좋습니다."

promotions:
  - {mn: "Анх удаа ирж буй үйлчлүүлэгчид нэг эмчилгээнд 10% хөнгөлөлт (бүх салбарт).",
     en: "First-time patients get 10% off one treatment (all branches).",
     ko: "첫 방문 고객은 시술 1회 10% 할인 (전 지점)."}
  - {mn: "Rejuran болон бусад skin booster-ыг лазер эмчилгээтэй нэг өдөр хийлгэвэл 10% хямд.",
     en: "Skin boosters such as Rejuran are 10% off when done the same day as a laser treatment.",
     ko: "리쥬란 등 스킨부스터를 레이저 시술과 같은 날 받으면 10% 할인."}

policies:
  - title: {mn: "Эмчилгээний тоо", en: "Number of sessions", ko: "시술 횟수"}
    text:
      mn: "Эмчилгээний тоо нь хувь хүний арьсны байдал, хариу урвалаас шалтгаална. Арьсны эмч үзлэгээр тодорхой төлөвлөгөө гаргана."
      en: "The number of sessions depends on each person's skin condition and how it responds. The dermatologist sets a plan at the consultation."
      ko: "시술 횟수는 개인의 피부 상태와 반응에 따라 다릅니다. 상담 시 전문의가 계획을 세워 드립니다."
  - title: {mn: "Цаг өөрчлөх, цуцлах", en: "Rescheduling and cancelling", ko: "예약 변경·취소"}
    text:
      mn: "Цагаа 24 цагийн өмнө өөрчлөх, цуцлах бол төлбөргүй. Чатаар эсвэл утсаар мэдэгдэнэ үү."
      en: "Rescheduling or cancelling up to 24 hours before is free. Let us know in the chat or by phone."
      ko: "예약 24시간 전까지 변경·취소는 무료입니다. 채팅이나 전화로 알려주세요."
  - title: {mn: "Төлбөр, урьдчилгаа", en: "Payment and deposit", ko: "결제·예약금"}
    text:
      mn: "Одоогоор төлбөрийг эмнэлэг дээр эмчилгээний дараа төлнө. Онлайн урьдчилгаа төлбөр удахгүй нэмэгдэнэ. Үнэ НӨАТ орсон."
      en: "For now you pay at the clinic after the treatment. Online deposits are coming soon. Prices include VAT."
      ko: "현재는 시술 후 내원 시 결제합니다. 온라인 예약금 결제는 곧 도입됩니다. 가격은 부가세 포함입니다."
  - title: {mn: "Жирэмсэн, хөхүүл үед", en: "Pregnancy and breastfeeding", ko: "임신·수유 중"}
    text:
      mn: "Жирэмсэн, хөхүүл үед ботокс, филлер, зарим лазер, хальслалт хийхгүй. Аюулгүй арчилгааг эмч зөвлөнө."
      en: "Botox, fillers, some lasers and peels are not done during pregnancy or breastfeeding. The doctor will suggest safe care."
      ko: "임신·수유 중에는 보톡스, 필러, 일부 레이저와 필링을 하지 않습니다. 안전한 관리를 전문의가 안내합니다."
  - title: {mn: "Насны хязгаар", en: "Age", ko: "연령"}
    text:
      mn: "18 хүртэлх насныхан эцэг эх эсвэл асран хамгаалагчтайгаа ирнэ. Ботокс, филлер 18 наснаас дээш."
      en: "Under-18s come with a parent or guardian. Botox and fillers are for 18 and over."
      ko: "만 18세 미만은 보호자와 함께 내원해야 합니다. 보톡스·필러는 만 18세 이상만 가능합니다."
  - title: {mn: "Эмчилгээний дараах арчилгаа", en: "Aftercare", ko: "시술 후 관리"}
    text:
      mn: "Лазерын дараа 3 хоног саун, халуун усанд орохгүй, архи хэрэглэхгүй, нарнаас хамгаалах тос (SPF 50) өдөр бүр түрхэнэ. Нүүрээ тэр өдрөө зөөлөн угааж болно."
      en: "After a laser: no sauna, hot baths or alcohol for 3 days, and SPF 50 sunscreen every day. You can wash your face gently the same day."
      ko: "레이저 후 3일간 사우나, 뜨거운 목욕, 음주를 피하고 매일 SPF 50 선크림을 바르세요. 당일 부드러운 세안은 가능합니다."
  - title: {mn: "Солонгос дахь монгол үйлчлүүлэгчид", en: "Mongolian patients in Korea", ko: "한국 지점의 몽골 고객"}
    text:
      mn: "Каннам, Мёндон салбарт монгол хэлтэй зохицуулагч үзлэг, эмчилгээний үеэр орчуулж, эмчилгээний дараах зөвлөгөөг монголоор өгнө. Бусад Солонгос салбарт видео дуудлагаар орчуулга хийнэ."
      en: "At Gangnam and Myeongdong a Mongolian-speaking coordinator interprets during the consultation and treatment and gives aftercare advice in Mongolian. Other Korea branches interpret by video call."
      ko: "강남·명동 지점에서는 몽골어 코디네이터가 상담과 시술 시 통역하고 사후관리를 몽골어로 안내합니다. 다른 한국 지점은 영상통화로 통역합니다."

faqs:
  - id: inflamed_acne
    question: {mn: "Үрэвсэл ихтэй батгатай бол ямар эмчилгээ хийх вэ?", en: "What do you do for badly inflamed acne?",
               ko: "염증성 여드름이 심하면 어떤 치료를 하나요?"}
    answer:
      mn: "Манай батгын багцаас гадна үрэвсэл ихтэй батгад NeoBeam лазер (тосны булчирхайг агшааж дахин сэдрэхээс сэргийлнэ), Gold PTT (алтны нанобөөмөөр нянг устгана), Select Acne лазер (4 үе шаттай) хийдэг. Аль нь тохирохыг арьсны эмч үзлэгээр шийднэ."
      en: "Besides our acne package, for heavily inflamed acne we use NeoBeam laser (shrinks oil glands and prevents flare-ups), Gold PTT (gold nanoparticles destroy acne bacteria) and the 4-step Select Acne laser. The dermatologist picks the right one at your consultation."
