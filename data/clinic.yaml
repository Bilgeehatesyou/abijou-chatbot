payment_methods:
  mn: "Монгол салбарууд: QPay, SocialPay, карт, бэлэн мөнгө, төлбөр бүрт и-Баримт. Солонгос салбарууд: карт (Visa, Master, UnionPay), бэлэн вон, KakaoPay. Онлайн урьдчилгаа төлбөр удахгүй нэмэгдэнэ; одоогоор эмнэлэг дээр төлнө."
  en: "Mongolia branches: QPay, SocialPay, card, cash, with an e-barimt receipt for every payment. Korea branches: card (Visa, Master, UnionPay), cash in KRW, KakaoPay. Online prepayment is coming soon; for now you pay at the clinic."
