summary:
  mn: "Abijou клиник нь Солонгосын арьс судлалын технологиор батга, улайлт, пигмент, арьс чангалах, skin booster эмчилгээ хийдэг клиник. Монголд 4, Солонгост 8 салбартай. Солонгосын Каннам, Мёндон салбарт монгол хэлтэй зохицуулагч ажилладаг."
  en: "Abijou Clinic treats acne, redness, pigmentation, skin laxity and offers skin boosters using Korean dermatology technology. 4 branches in Mongolia and 8 in Korea. Our Gangnam and Myeongdong branches in Seoul have Mongolian-speaking coordinators."
  ko: "아비쥬의원은 한국 피부과 기술로 여드름, 홍조, 색소, 리프팅, 스킨부스터 시술을 하는 클리닉입니다. 몽골 4개, 한국 8개 지점이 있으며 서울 강남·명동 지점에는 몽골어 코디네이터가 상주합니다."
