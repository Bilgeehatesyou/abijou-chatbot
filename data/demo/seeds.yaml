# Demo businesses. The LLM generates each profile + FAQs from these.
# "kind" doubles as the Messenger button label, so keep it short (20-char limit).
# Fictional ones: names, phones, emails and websites are fixed here so they stay fake
# (Mongolian numbers never start with 0, and ".example" domains can't exist).
# Real ones: `fictional: false`, with their public facts pinned under `fixed:`.
#
# Regenerate one:  python -m app.demo_data generate --only dental --force
# Load into DB:    python -m app.demo_data load

industries:
  - id: dental
    emoji: "🦷"
    label: {mn: "Шүдний эмнэлэг", en: "Dental"}
  - id: education
    emoji: "🎓"
    label: {mn: "Боловсрол", en: "Education"}
  - id: wholesale
    emoji: "📦"
    label: {mn: "Бөөний худалдаа", en: "Wholesale"}
  - id: salon
    emoji: "💇"
    label: {mn: "Салон & спа", en: "Salon & Spa"}
  - id: hospitality
    emoji: "🏨"
    label: {mn: "Зочид буудал", en: "Hotel & Venues"}

businesses:
  # REAL clinic (public info from facebook.com/Mayflower77223368 and
  # instagram.com/mayflower_dental_clinic, 2026-09-21). Hours and doctors aren't public:
  # typical hours and generic "Эмч 1/2" are placeholders. Prices are estimates.
  - id: dental
    industry: dental
    kind: {mn: "Шүдний эмнэлэг", en: "Dental clinic"}
    emoji: "🦷"
    name: {mn: "Mayflower шүдний эмнэлэг", en: "Mayflower Dental"}
    phone: "+976 7722-3368"
    slug: mayflower-dental
    fictional: false
    fixed:
      address: {mn: "Хан-Уул дүүрэг, 11-р хороо, Энхжин хотхон, 32Б байр, 104 тоот",
                en: "Apt 104, Building 32B, Enkhjin town, 11th khoroo, Khan-Uul District, Ulaanbaatar"}
      hours: {mn: "Даваа–Баасан 09:00–18:00, Бямба 10:00–15:00, Ням гарагт амарна",
              en: "Mon–Fri 09:00–18:00, Sat 10:00–15:00, closed on Sunday"}
      website: "https://www.instagram.com/mayflower_dental_clinic/"
      email: ""
    brief: >
      Real dental clinic "Mayflower dental" with ONE location in Enkhjin town,
      Khan-Uul district. Tagline: "We customize it to treat all kinds of dental
      problems." Services from their Instagram: general oral treatment (fillings,
      cleaning), root canal treatment, orthodontics (braces and clear aligners,
      called "апп эмчилгээ"), prosthodontics (crowns, bridges, dentures "хиймэл шүд"),
      oral surgery (extractions, wisdom teeth), dental imaging / X-ray diagnostics.
      Mid-range price level. They don't publish prices: use realistic mid-range
      Ulaanbaatar 2026 estimates. Booking by phone 7722-3368 or Facebook/Instagram
      message. Do not invent doctor names, awards, years in business or other branches.
    booking:
      hours: {mon: "09:00-18:00", tue: "09:00-18:00", wed: "09:00-18:00", thu: "09:00-18:00",
              fri: "09:00-18:00", sat: "10:00-15:00"}
      address: {mn: "Хан-Уул дүүрэг, 11-р хороо, Энхжин хотхон, 32Б байр, 104 тоот",
                en: "Apt 104, Building 32B, Enkhjin town, 11th khoroo, Khan-Uul District"}
      # price: the profile's estimates (consult-type services use the 30,000₮ exam fee)
      services:
        - {id: consultation, minutes: 30, price: 30000, name: {mn: "Үзлэг, зөвлөгөө", en: "Consultation"}}
        - {id: treatment, minutes: 60, price: 90000, name: {mn: "Шүдний эмчилгээ", en: "Dental treatment"}}
        - {id: root_canal, minutes: 60, price: 350000, name: {mn: "Сувгийн эмчилгээ", en: "Root canal"}}
        - {id: orthodontics, minutes: 30, price: 30000, name: {mn: "Гажиг засал", en: "Orthodontics"}}
        - {id: prosthetics, minutes: 30, price: 30000, name: {mn: "Хиймэл шүд, бүрээс", en: "Crowns & dentures"}}
        - {id: extraction, minutes: 45, price: 100000, name: {mn: "Шүд авалт", en: "Tooth extraction"}}
        - {id: xray, minutes: 30, price: 30000, name: {mn: "Рентген зураг", en: "X-ray"}}
      choose_staff: true
      staff:
        - {id: doctor1, name: {mn: "Эмч 1", en: "Doctor 1"},
           role: {mn: "Ерөнхий шүдний эмч, мэс засал", en: "General dentist & oral surgery"},
